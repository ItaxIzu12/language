server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gebaute Dateien haben einen Hash im Namen und dürfen lange gecacht werden.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html immer frisch laden, damit Updates sofort ankommen.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
