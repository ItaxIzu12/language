limit_req_zone $binary_remote_addr zone=accounts:1m rate=6r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    client_max_body_size 4m;
    proxy_set_header Host $http_host;
    location ~ ^/api/v1/(login|register|password-reset|password-reset-confirm|recovery-email)/$ {
        limit_req zone=accounts burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
    }
    location /api/ {
        proxy_pass http://backend:8000;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gebaute Dateien haben einen Hash im Namen und dürfen lange gecacht werden.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html immer frisch laden, damit Updates sofort ankommen.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
