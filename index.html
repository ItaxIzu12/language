<!doctype html>
<html lang="de" class="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#BE2E1A" />
    <meta
      name="description"
      content="LinguaFlow – moderne App zum Sprachenlernen. Start: Chinesisch (Mandarin) mit Karteikarten, SRS, Quiz, Aussprache und Podcasts."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>LinguaFlow</title>
    <script>
      // Apply saved theme before paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("linguaflow.theme");
          if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
