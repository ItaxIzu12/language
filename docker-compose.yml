services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linguaflow}
      POSTGRES_USER: ${POSTGRES_USER:-linguaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Pflichtwert in .env eintragen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linguaflow}
      POSTGRES_USER: ${POSTGRES_USER:-linguaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Pflichtwert in .env eintragen}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Pflichtwert in .env eintragen}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  linguaflow:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
